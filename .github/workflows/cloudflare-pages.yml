name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: ["main", "claude/bold-hawking-8o28g3"]
    paths: ["frontend/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask API URL in logs
        run: |
          url="${PUBLIC_API_URL%/}"
          if [ -z "$url" ]; then
            echo "::error::Secret PUBLIC_API_URL is empty or missing"
            exit 1
          fi
          host="${url#https://}"; host="${host%%/*}"
          echo "::add-mask::$url"
          echo "::add-mask::$host"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: |
          export VITE_API_URL="${PUBLIC_API_URL%/}"
          npm run build

      - name: Verify API URL is baked into the bundle
        working-directory: frontend
        run: |
          if grep -qE 'https://[a-zA-Z0-9.-]+\.on\.aws' dist/assets/*.js; then
            echo "API URL is baked into the bundle"
          else
            echo "::error::No *.on.aws URL found in the bundle; PUBLIC_API_URL is likely wrong"
            exit 1
          fi

      - name: Create Pages project if missing
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create snowy --production-branch=main \
            || echo "Project create skipped (it may already exist)"

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name=snowy --branch=main

      - name: Verify https://snowy.pages.dev served this build
        working-directory: frontend
        run: |
          expected=$(basename dist/assets/index-*.js)
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /tmp/prod_body.html -w "%{http_code}" https://snowy.pages.dev/)
            if [ "$status" = "200" ] && grep -q "$expected" /tmp/prod_body.html; then
              echo "Confirmed: snowy.pages.dev is serving $expected"
              exit 0
            fi
            sleep 5
          done
          echo "::error::snowy.pages.dev (status $status) is not serving $expected after retrying"
          exit 1
