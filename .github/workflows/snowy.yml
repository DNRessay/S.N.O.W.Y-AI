name: SNOWY CI/CD

on:
  push:
    branches: ["main", "claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  pull_request:
    branches: ["main", "claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  AWS_REGION_RESOLVED: ${{ secrets.AWS_REGION || 'eu-west-1' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to AWS (SAM)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    # Deploy on push / manual run from main or the feature branch; never on PRs.
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/bold-hawking-8o28g3')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-snowy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_RESOLVED }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # SAM CLI is preinstalled on ubuntu-latest; no install step needed.
      - name: Verify AWS SAM CLI
        run: sam --version

      - name: sam build
        run: sam build

      - name: Mask public URL in logs
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: |
          url="${PUBLIC_API_URL%/}"
          host="${url#https://}"; host="${host%%/*}"
          echo "::add-mask::$url"
          echo "::add-mask::$host"

      - name: sam deploy
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          SNOWY_ENABLED: ${{ vars.SNOWY_ENABLED || secrets.SNOWY_ENABLED }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LOCAL_LLM_URL: ${{ secrets.LOCAL_LLM_URL }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_VIDEO_URL: ${{ secrets.MODAL_VIDEO_URL }}
          MODAL_VIDEO_SECRET: ${{ secrets.MODAL_VIDEO_SECRET }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          OWNER_WHATSAPP_NUMBER: ${{ secrets.OWNER_WHATSAPP_NUMBER }}
          PULSE_BRIEF_HOUR: ${{ secrets.PULSE_BRIEF_HOUR }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MODAL_EMBEDDINGS_URL: ${{ secrets.MODAL_EMBEDDINGS_URL }}
          MODAL_REPO_URL: ${{ secrets.MODAL_REPO_URL }}
          MODAL_REPO_SECRET: ${{ secrets.MODAL_REPO_SECRET }}
          SNOWY_SECRET_KEY: ${{ secrets.SNOWY_SECRET_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          OPENCLAW_URL: ${{ secrets.OPENCLAW_URL }}
          OPENCLAW_WEBHOOK_SECRET: ${{ secrets.OPENCLAW_WEBHOOK_SECRET }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          RESET_EMAILS: ${{ secrets.RESET_EMAILS }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          MCP_SERVERS: ${{ secrets.MCP_SERVERS }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GITLAB_OAUTH_CLIENT_ID: ${{ secrets.GITLAB_OAUTH_CLIENT_ID }}
          GITLAB_OAUTH_CLIENT_SECRET: ${{ secrets.GITLAB_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # Strip CR/LF from secrets (copy-paste artifacts truncate commands).
          clean() { printf '%s' "$1" | tr -d '\r\n'; }

          # Optional params are skipped when empty: sam rejects "Key=".
          params=()
          add() { if [ -n "$2" ]; then params+=("$1=$2"); fi; }

          case "$(printf '%s' "$SNOWY_ENABLED" | tr -d '\r\n ' | tr 'A-Z' 'a-z')" in
            false|off|0|no) snowy_enabled=false ;;
            *) snowy_enabled=true ;;
          esac
          echo "SNOWY_ENABLED -> ${snowy_enabled}"

          # Always passed: CloudFormation reuses the previous deployed value
          # for omitted params, so keep model IDs in sync with template.yaml.
          params+=(
            "SnowyEnabled=${snowy_enabled}"
            "GroqApiKey=$(clean "$GROQ_API_KEY")"
            "NeonDatabaseUrl=$(clean "$NEON_DATABASE_URL")"
            "SecretKey=$(clean "$SNOWY_SECRET_KEY")"
            "GroqModel=qwen/qwen3.8-27b"
            "GroqPlanningModel=openai/gpt-oss-120b"
            "CohereModel=command-a-03-2025"
            "PublicApiUrl=$(clean "$PUBLIC_API_URL")"
          )

          add CohereApiKey          "$(clean "$COHERE_API_KEY")"
          add LocalLlmUrl           "$(clean "$LOCAL_LLM_URL")"
          add LocalLlmApiKey        "$(clean "$LOCAL_LLM_API_KEY")"
          add GeminiApiKey          "$(clean "$GEMINI_API_KEY")"
          add AnthropicApiKey       "$(clean "$ANTHROPIC_API_KEY")"
          add OpenaiApiKey          "$(clean "$OPENAI_API_KEY")"
          add QwenApiKey            "$(clean "$QWEN_API_KEY")"
          add DeepseekApiKey        "$(clean "$DEEPSEEK_API_KEY")"
          add KimiApiKey            "$(clean "$KIMI_API_KEY")"
          add HfToken               "$(clean "$HF_TOKEN")"
          add ModalVideoUrl         "$(clean "$MODAL_VIDEO_URL")"
          add ModalVideoSecret      "$(clean "$MODAL_VIDEO_SECRET")"
          add SearxngUrl            "$(clean "$SEARXNG_URL")"
          add OwnerWhatsappNumber   "$(clean "$OWNER_WHATSAPP_NUMBER")"
          add PulseBriefHour        "$(clean "$PULSE_BRIEF_HOUR")"
          add ModalEmbeddingsUrl    "$(clean "$MODAL_EMBEDDINGS_URL")"
          add ModalRepoUrl          "$(clean "$MODAL_REPO_URL")"
          add ModalRepoSecret       "$(clean "$MODAL_REPO_SECRET")"
          add SerpApiKey            "$(clean "$SERP_API_KEY")"
          add WhatsappToken         "$(clean "$WHATSAPP_TOKEN")"
          add WhatsappPhoneId       "$(clean "$WHATSAPP_PHONE_ID")"
          add WhatsappVerifyToken   "$(clean "$WHATSAPP_VERIFY_TOKEN")"
          add GithubWebhookSecret   "$(clean "$GH_WEBHOOK_SECRET")"
          add OpenclawUrl           "$(clean "$OPENCLAW_URL")"
          add OpenclawWebhookSecret "$(clean "$OPENCLAW_WEBHOOK_SECRET")"
          add WhatsappAppSecret     "$(clean "$WHATSAPP_APP_SECRET")"
          add ResetEmails           "$(printf '%s' "$RESET_EMAILS" | tr -d '\r\n ' | tr ',' ';')"
          add SesFromEmail          "$(clean "$SES_FROM_EMAIL")"
          add McpServers            "$(clean "$MCP_SERVERS")"
          add GithubClientId        "$(clean "$GH_OAUTH_CLIENT_ID")"
          add GithubClientSecret    "$(clean "$GH_OAUTH_CLIENT_SECRET")"
          add GitlabClientId        "$(clean "$GITLAB_OAUTH_CLIENT_ID")"
          add GitlabClientSecret    "$(clean "$GITLAB_OAUTH_CLIENT_SECRET")"
          add GoogleClientId        "$(clean "$GOOGLE_OAUTH_CLIENT_ID")"
          add GoogleClientSecret    "$(clean "$GOOGLE_OAUTH_CLIENT_SECRET")"

          sam deploy \
            --debug \
            --region "$AWS_REGION_RESOLVED" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"

      - name: Diagnose changeset failure
        if: failure()
        run: |
          region="$AWS_REGION_RESOLVED"
          aws cloudformation list-change-sets --stack-name snowy --region "$region" || true
          latest=$(aws cloudformation list-change-sets --stack-name snowy --region "$region" \
            --query 'reverse(sort_by(Summaries, &CreationTime))[0].ChangeSetId' --output text 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "None" ]; then
            aws cloudformation describe-change-set --stack-name snowy --region "$region" --change-set-name "$latest" || true
          fi
          aws cloudformation describe-stack-events --stack-name snowy --region "$region" --max-items 10 || true
          aws cloudformation describe-events --stack-name snowy --region "$region" --max-items 20 || true

      - name: Expire old build artifacts (14 days)
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" \
            --output text)
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET" \
            --lifecycle-configuration '{
              "Rules": [{
                "ID": "expire-old-build-artifacts",
                "Status": "Enabled",
                "Filter": {},
                "Expiration": {"Days": 14},
                "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}
              }]
            }'

      - name: Smoke test deployed endpoint
        run: |
          region="$AWS_REGION_RESOLVED"
          url=$(aws cloudformation describe-stacks --stack-name snowy --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='ChatFunctionUrl'].OutputValue" --output text)
          url="${url%/}"
          host="${url#https://}"; host="${host%%/*}"
          echo "::add-mask::$url"
          echo "::add-mask::$host"

          echo "GET $url/health"
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" "$url/health")
          echo "status=$status body=$(cat /tmp/body.txt)"
          [ "$status" = "200" ] || { echo "::error::/health returned $status, expected 200"; exit 1; }

          echo "POST $url/auth/login (expect 401)"
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST "$url/auth/login" \
            -H "Content-Type: application/json" -d '{"passphrase":"__smoke_test_wrong__"}')
          echo "status=$status body=$(cat /tmp/body.txt)"
          [ "$status" = "401" ] || { echo "::error::/auth/login returned $status, expected 401"; exit 1; }

          echo "OPTIONS $url/auth/login (CORS preflight)"
          preflight_args=(-X OPTIONS "$url/auth/login"
            -H "Origin: https://snowy.pages.dev"
            -H "Access-Control-Request-Method: POST"
            -H "Access-Control-Request-Headers: content-type")
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" "${preflight_args[@]}")
          echo "status=$status headers:"
          curl -s -D - -o /dev/null "${preflight_args[@]}"
          [ "$status" -lt 300 ] || { echo "::error::CORS preflight returned $status"; exit 1; }

          for path in /connectors /skills; do
            echo "GET $url$path (expect 401)"
            status=$(curl -s -o /tmp/body.txt -w "%{http_code}" "$url$path")
            echo "status=$status body=$(cat /tmp/body.txt)"
            [ "$status" = "401" ] || { echo "::error::$path returned $status, expected 401"; exit 1; }
          done
